[project]
name = "jieba-em-train"
version = "0.1.0"
description = "Train jieba dictionary frequencies by EM"
readme = "README.md"
authors = [
    { name = "kkew3", email = "kps6326@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.1.0",
    "jieba",
    "jupyter>=1.1.1",
    "jupyterlab-execute-time>=3.3.0",
    "lxml>=6.1.3",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pyahocorasick>=2.3.1",
    "pyyaml>=6.0.3",
    "rjieba",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.scripts]
build-dag = "jieba_em_train.build_dag:main"
process-wiki-data = "jieba_em_train.preprocess_data:process_wiki_data_main"
process-html-data = "jieba_em_train.preprocess_data:process_html_data_main"
parse-msra-xml = "jieba_em_train.parse_msra_xml:main"

[tool.maturin]
module-name = "jieba_em_train._core"
python-packages = ["jieba_em_train"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[tool.uv.sources]
rjieba = { git = "http://gitea.dell-p3460.local/kkew3/rjieba-py.git", rev = "dev" }
jieba = { git = "https://github.com/tirkarthi/jieba.git", rev = "fix-warnings" }

[tool.ruff]
line-length = 80

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
